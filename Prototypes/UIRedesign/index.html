<style>/* Ember: warm graphite, champagne highlights, and an ivory light appearance. */
html,body { margin:0; background:transparent; }

#dictaflow-prototype .df-menu-capture h3 { font-size:18px; font-weight:500; margin:9px 0 5px; color:var(--df-paper-ink); }
#dictaflow-prototype .df-menu-capture .df-eyebrow { color:var(--df-paper-muted); font-size:11px; letter-spacing:.7px; }
#dictaflow-prototype .df-menu-capture small { color:var(--df-paper-muted); font-size:11px; }
#dictaflow-prototype .df-menu-record-button { width:48px; height:48px; border-radius:50%; background:var(--df-action); color:var(--df-action-ink); border:0; display:flex; align-items:center; justify-content:center; align-self:center; }
#dictaflow-prototype .df-menu-record-button .df-icon { width:22px; height:22px; opacity:1; }
#dictaflow-prototype .df-menu-wave { grid-column:1/-1; overflow:hidden; height:25px; }
#dictaflow-prototype .df-menu-wave .df-wave { height:25px; }
#dictaflow-prototype .df-menu-footer { display:flex; justify-content:space-between; padding:10px 7px 3px; }
#dictaflow-prototype .df-menu-footer .df-link { display:flex; gap:7px; align-items:center; color:var(--df-text); }
#dictaflow-prototype .df-menu-footer .df-icon { width:14px; height:14px; }
#dictaflow-prototype .df-maximize { border:0; padding:0; }
#dictaflow-prototype .df-window.df-maximized { grid-template-rows:68px 1036px; border-radius:0; }
#dictaflow-prototype .df-window.df-collapsed { grid-template-columns:80px minmax(0,1fr); }
#dictaflow-prototype .df-collapsed .df-sidebar { padding:18px 8px; }
#dictaflow-prototype .df-collapsed .df-lights { gap:4px; padding:0; }
#dictaflow-prototype .df-collapsed .df-light { width:10px; height:10px; }
#dictaflow-prototype .df-history-shell { grid-template-columns:minmax(210px,.34fr) minmax(0,1fr); min-height:530px; border-radius:24px; }
#dictaflow-prototype .df-history-list { padding:20px 14px; }
#dictaflow-prototype .df-history-detail { padding:26px 30px; }
#dictaflow-prototype .df-history-detail h3 { font-size:20px; font-weight:500; margin-bottom:5px; }
#dictaflow-prototype .df-history-reading { max-height:260px; }
#dictaflow-prototype .df-history-text { font-size:18px; line-height:1.8; }
#dictaflow-prototype .df-history-item { border-radius:15px; padding:14px 12px; }
#dictaflow-prototype .df-history-item[aria-pressed="true"] { background:var(--df-accent-soft); }
#dictaflow-prototype .df-theme-thumb { background:#f3f0e9; border-color:#d8d4c8; border-radius:12px; height:135px; }
#dictaflow-prototype .df-theme-thumb:before { background:#e9e4d8; border-color:#d8d4c8; }
#dictaflow-prototype .df-theme-thumb:after { background:linear-gradient(#fffdf8 45%,transparent 45% 58%,#fffdf8 58%); border-radius:8px; }
#dictaflow-prototype .df-theme-thumb.dark { background:#171816; border-color:#414239; }
#dictaflow-prototype .df-theme-thumb.dark:before { background:#292a25; border-color:#414239; }
#dictaflow-prototype .df-theme-thumb.dark:after { background:linear-gradient(#40392d 45%,transparent 45% 58%,#40392d 58%); }
#dictaflow-prototype .df-theme-thumb.system { background:linear-gradient(90deg,#f3f0e9 50%,#171816 50%); }
#dictaflow-prototype .df-theme-thumb.system:after { background:linear-gradient(90deg,#fffdf8 30%,#40392d 30%); }
@container config (max-width:420px) {
  #dictaflow-prototype .df-field-pair { grid-template-columns:1fr; }
  #dictaflow-prototype .df-field-cell { display:grid; grid-template-columns:minmax(0,1fr) auto; align-items:center; gap:5px 16px; padding:15px 18px; }
  #dictaflow-prototype .df-field-cell p { grid-column:1; margin-bottom:0; }
  #dictaflow-prototype .df-field-cell .df-select,#dictaflow-prototype .df-field-cell .df-segment { grid-column:2; grid-row:1/3; width:auto; max-width:165px; }
  #dictaflow-prototype .df-module-heading .df-local-label { display:none; }
  #dictaflow-prototype .df-model-row { flex-wrap:wrap; }
  #dictaflow-prototype .df-model-row .df-control { margin-left:auto; }
  #dictaflow-prototype .df-row { flex-wrap:wrap; }
}
@container (max-width:760px) {
  #dictaflow-prototype .df-workspace-grid,#dictaflow-prototype .df-home-grid,#dictaflow-prototype .df-home-secondary { grid-template-columns:minmax(0,1fr); }

  #dictaflow-prototype .df-stage { padding:14px 12px; border-radius:17px; }
  #dictaflow-prototype .df-stage-main { gap:8px; }
  #dictaflow-prototype .df-stage-main .df-provider { width:24px; height:24px; padding:3px; border-radius:7px; }
  #dictaflow-prototype .df-stage-main strong { font-size:12px; }
  #dictaflow-prototype .df-stage-main small { font-size:11px; }
  #dictaflow-prototype .df-stage-top { font-size:11px; gap:4px; }
  #dictaflow-prototype .df-stage-tabs { gap:8px; }
  #dictaflow-prototype .df-paper { min-height:320px; }
}
@media(max-width:1000px) and (min-width:581px) {
  #dictaflow-prototype .df-window { grid-template-columns:80px minmax(0,1fr); }
  #dictaflow-prototype .df-window.df-expanded { grid-template-columns:200px minmax(0,1fr); }
  #dictaflow-prototype .df-window:not(.df-expanded) .df-sidebar { padding:18px 8px; }
  #dictaflow-prototype .df-window:not(.df-expanded) .df-brand { padding:20px 0 25px; justify-content:center; }
  #dictaflow-prototype .df-window:not(.df-expanded) .df-brand>div,#dictaflow-prototype .df-window:not(.df-expanded) .df-nav-label,#dictaflow-prototype .df-window:not(.df-expanded) .df-nav-caption,#dictaflow-prototype .df-window:not(.df-expanded) .df-sidebar-bottom { display:none; }
  #dictaflow-prototype .df-window:not(.df-expanded) .df-nav-item { justify-content:center; padding:12px; }
  #dictaflow-prototype .df-window:not(.df-expanded) .df-lights { gap:4px; padding:0; }
  #dictaflow-prototype .df-window:not(.df-expanded) .df-light { width:10px; height:10px; }
  #dictaflow-prototype .df-main { padding:18px 22px 28px; }
  #dictaflow-prototype .df-history-detail { padding:20px; }
}
@media(max-width:580px) {
  #dictaflow-prototype .df-workspace-title h2 { font-size:27px; }
  #dictaflow-prototype .df-stage-tabs { grid-template-columns:1fr; gap:7px; margin-bottom:24px; }
  #dictaflow-prototype .df-stage { display:flex; align-items:center; gap:15px; padding:12px 14px; }
  #dictaflow-prototype .df-stage-top { margin:0; width:110px; flex-shrink:0; font-size:11px; }
  #dictaflow-prototype .df-stage-top .df-icon { display:none; }
  #dictaflow-prototype .df-stage-main strong { font-size:12px; }
  #dictaflow-prototype .df-stage-main small { display:none; }
  #dictaflow-prototype .df-main { padding:18px 16px 28px; }
  #dictaflow-prototype .df-paper { padding:21px; }
  #dictaflow-prototype .df-paper-result p { font-size:21px; }
  #dictaflow-prototype .df-field-cell { display:flex; align-items:stretch; }
  #dictaflow-prototype .df-field-cell .df-select,#dictaflow-prototype .df-field-cell .df-segment { width:100%; max-width:none; margin-top:7px; }
  #dictaflow-prototype .df-module-heading h2 { font-size:20px; }
  #dictaflow-prototype .df-history-shell { display:block; }
  #dictaflow-prototype .df-history-detail { padding:20px; }
  #dictaflow-prototype .df-menu-popover { width:340px; max-width:calc(100% - 24px); right:12px; }
  #dictaflow-prototype .df-home-record { padding:24px; }
  #dictaflow-prototype .df-home-record h2 { font-size:26px; }
  #dictaflow-prototype .df-theme-thumb { height:72px; }
}

/* Consolidated navigation and preference categories use the existing Ember controls. */
#dictaflow-prototype .df-sidebar-utility { margin-top:auto; }
#dictaflow-prototype .df-sidebar-bottom { margin-top:0; }
#dictaflow-prototype .df-config-column>.df-panel+.df-alert { margin-top:14px; }
#dictaflow-prototype .df-settings-tabs { width:fit-content; max-width:100%; margin-bottom:26px; }
#dictaflow-prototype .df-settings-tabs .df-tab { min-width:110px; }
#dictaflow-prototype .df-settings-panel .df-intro { margin-bottom:20px; }
#dictaflow-prototype .df-settings-panel .df-intro h2 { font-size:21px; letter-spacing:-.5px; font-weight:500; }
#dictaflow-prototype .df-settings-grid { display:grid; grid-template-columns:minmax(0,1.15fr) minmax(0,1fr); gap:26px; align-items:start; }
#dictaflow-prototype .df-settings-grid>section,#dictaflow-prototype .df-settings-grid>aside { min-width:0; }
#dictaflow-prototype .df-settings-grid .df-row { flex-wrap:wrap; }
#dictaflow-prototype .df-settings-grid .df-row .df-control { flex-shrink:0; }
#dictaflow-prototype .df-tone-guidance { display:flex; align-items:center; gap:8px; margin-top:22px; font-size:12px; color:var(--df-muted); }
#dictaflow-prototype .df-tone-guidance .df-icon { color:var(--df-green); }
#dictaflow-prototype .df-menu-utility { padding:15px 7px 3px; margin-top:12px; border-top:1px solid var(--df-line); }
#dictaflow-prototype .df-menu-utility .df-link { color:var(--df-muted); display:flex; align-items:center; gap:8px; }
#dictaflow-prototype .df-menu-utility .df-icon { width:14px; height:14px; }
#dictaflow-prototype .df-model-failed { background:var(--df-error-bg); border:1px solid var(--df-error-line); border-radius:16px; padding:13px 12px; margin:4px 0; }
#dictaflow-prototype .df-model-failed:last-child { border-bottom:1px solid var(--df-error-line); }
#dictaflow-prototype .df-model-failed .df-error { color:var(--df-error-ink); }
@container (max-width:760px) { #dictaflow-prototype .df-settings-grid { grid-template-columns:minmax(0,1fr); } }
@media(max-width:580px) { #dictaflow-prototype .df-settings-tabs { width:100%; } #dictaflow-prototype .df-settings-tabs .df-tab { min-width:0; padding:9px; } }
</style>

    <aside class="df-sidebar" aria-label="DictaFlow navigation">
      <div class="df-lights"><span class="df-light" aria-hidden="true"></span><span class="df-light" aria-hidden="true"></span><button class="df-light df-maximize" data-action="maximize" aria-label="Expand window vertically" aria-pressed="false"></button></div>
      <div class="df-brand" id="brand"></div>
      <nav id="sidebar-nav"></nav>

      <div class="df-sidebar-bottom"><div class="df-private"><span class="df-dot"></span>Processing stays on your Mac</div><small style="font-size:11px;display:block;margin-top:6px">DictaFlow Dev</small></div>

    <header class="df-titlebar">

    <button class="df-link" data-action="reset">Reset demo</button>

  function applyAppearance() {
    const osAppearance=window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';
    if(state.theme!=='system'){root.dataset.theme=state.theme;return;}
    const hostSurface=getComputedStyle(document.documentElement).getPropertyValue('--background').trim();
    if(hostSurface&&CSS.supports('color',hostSurface)) {
      const canvas=document.createElement('canvas');canvas.width=canvas.height=1;
      const context=canvas.getContext('2d');
      if(context) {
        context.fillStyle=hostSurface;context.fillRect(0,0,1,1);
        const [red,green,blue,alpha]=context.getImageData(0,0,1,1).data;
        if(alpha){root.dataset.theme=(red*.2126+green*.7152+blue*.0722)<128?'dark':'light';return;}
      }
    }
    root.dataset.theme=osAppearance;
  }
  function restoreFocus(element) {
    if(!element||element.isConnected)return;

    const match=element.id?$('#'+element.id):candidates.find(candidate=>Object.keys(element.dataset).length&&JSON.stringify(candidate.dataset)===JSON.stringify(element.dataset));
    if(match&&!match.disabled) {
      match.focus({preventScroll:true});
      if(typeof element.selectionStart==='number'&&typeof match.setSelectionRange==='function')match.setSelectionRange(element.selectionStart,element.selectionEnd);
    }
  }

    const input=event.target;
    if(input.id==='mobile-nav') {navigate(input.value);return;}
    if(input.dataset.setting) {const key=input.dataset.setting;state[key]=input.type==='checkbox'?input.checked:key==='style'?Number(input.value):input.value;render();}
    else if(input.id==='retention') {const retention=Number(input.value);state.retention=retention;render();}
    else if(input.id==='scenario') {
      cancelDownloads(); clearInterval(recorderTimer);clearTimeout(processingTimer);recording='idle';
      state.scenario=input.value;state.microphone=input.value!=='microphone';state.accessibility=input.value!=='accessibility';
      if(!state.installed.includes('small'))state.installed.push('small');
      if(input.value==='missing'){state.page='dictation';state.tab='transcription';state.installed=state.installed.filter(id=>id!=='small');state.speechModel='small';state.encoders=state.encoders.filter(id=>id!=='small');}
      if(input.value==='refinement'){state.tab='refinement';state.page='dictation';state.refineOn=true;}
      if(input.value==='microphone'||input.value==='accessibility'){state.page='settings';state.settingsTab='permissions';}
      if(input.value==='welcome'){state.installed=[];state.encoders=[];state.microphone=false;state.accessibility=false;state.refineOn=false;state.speechModel='small';state.page='dictation';}
      render();
      if(input.value==='download')showModal('models',{module:'speech'});
      if(input.value==='welcome')showModal('welcome');
    }
  });
  root.addEventListener('input', event=>{
    if(event.target.id==='history-search') updateHistorySearch(event.target.value);
    else if(event.target.id==='instructions'||event.target.id==='prompt') {
      const custom=event.target.id==='prompt',text=event.target.value;
      if(custom)state.promptDraft=text;else state.instructionDrafts[state.style]=text;
      const dirty=custom?text!==state.prompt:text!==(state.instructions[state.style]||'');
      $('#editor-state').textContent=dirty?'Unsaved changes':'Saved';$('#save-instructions').disabled=!dirty||custom&&!text.trim();
    }
  });
  root.addEventListener('submit', event=>{
    if(event.target.id!=='vocabulary-form')return; event.preventDefault();
    const input=$('#vocabulary-input'), word=input.value.trim().replace(/,/g,'');
    let error='';
    if(!word)return;
    if(/\s/.test(word))error='Use a single word for each keyword.';
    else if(state.vocabulary.some(term=>term.toLowerCase()===word.toLowerCase()))error='This keyword is already added.';
    else if(state.vocabulary.length>=50)error='You can add up to 50 keywords.';
    if(error){$('#vocabulary-error').textContent=error;return;}
    state.vocabulary.push(word);render();$('#vocabulary-disclosure').open=true;$('#vocabulary-input').focus();
  });
  root.addEventListener('toggle', event=>{
    if(modalState?.kind!=='models'||!event.target.isConnected)return;
    if(event.target.id==='encoder-disclosure')modalState.encoderOpen=event.target.open;
  },true);
  document.addEventListener('keydown', event=>{
    if(modalState) {
      if(event.key==='Escape') {event.preventDefault();if(modalState.kind==='confirm')cancelConfirmation();else closeModal();return;}
      if(event.key==='Tab') {
        const controls=Array.from($('#modal').querySelectorAll('button:not(:disabled),input:not(:disabled),select:not(:disabled),textarea:not(:disabled),a[href],summary')).filter(el=>el.getClientRects().length);
        const first=controls[0], last=controls[controls.length-1];
        if(event.shiftKey&&document.activeElement===first){event.preventDefault();last?.focus();}
        else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first?.focus();}
      }
      return;
    }
    if(event.target.getAttribute?.('role')==='tab'&&['ArrowLeft','ArrowRight','Home','End'].includes(event.key)) {
      const tabs=Array.from(event.target.closest('[role="tablist"]').querySelectorAll('[role="tab"]'));
      const index=event.key==='Home'?0:event.key==='End'?tabs.length-1:(tabs.indexOf(event.target)+(event.key==='ArrowRight'?1:-1)+tabs.length)%tabs.length;
      const id=tabs[index].id;event.preventDefault();tabs[index].click();$('#'+id)?.focus();return;
    }
    if(event.target.closest?.('#sidebar-nav')&&['ArrowUp','ArrowDown','Home','End'].includes(event.key)) {
      const items=Array.from($('#sidebar-nav').querySelectorAll('button'));
      const index=event.key==='Home'?0:event.key==='End'?items.length-1:Math.max(0,Math.min(items.length-1,items.indexOf(event.target)+(event.key==='ArrowDown'?1:-1)));
      const id=items[index].id;event.preventDefault();items[index].click();$('#'+id).focus();return;
    }
    if(captureShortcut) {
      if(event.key==='Escape'){event.preventDefault();captureShortcut=false;render();return;}
      if(['Meta','Shift','Alt','Control'].includes(event.key))return;
      event.preventDefault();
      if(!(event.metaKey||event.ctrlKey||event.altKey||event.shiftKey)){ $('#shortcut-message').textContent='Include at least one modifier key.';return; }
      state.shortcut=[...(event.metaKey?['⌘']:[]),...(event.ctrlKey?['⌃']:[]),...(event.altKey?['⌥']:[]),...(event.shiftKey?['⇧']:[]),event.key===' '?'Space':event.key.toUpperCase()];
      state.shortcutCode=event.code;state.shortcutModifiers={meta:event.metaKey,ctrl:event.ctrlKey,alt:event.altKey,shift:event.shiftKey};captureShortcut=false;render();toast('Shortcut saved for this prototype.');return;
    }
    if(event.key==='Escape') {if(!$('#menu-popover').hidden){event.preventDefault();closeMenu(true);}else if(busy()){event.preventDefault();cancelRecording();}}
    if(event.code===state.shortcutCode&&event.metaKey===state.shortcutModifiers.meta&&event.ctrlKey===state.shortcutModifiers.ctrl&&event.altKey===state.shortcutModifiers.alt&&event.shiftKey===state.shortcutModifiers.shift&&!event.target.matches?.('input,textarea,select')) {event.preventDefault();startRecording();}
  });
  if(globalThis.Tweak) {
    const tweaks={glass:true};
    const tweak=new Tweak({container:$('#app-window'),onChange:()=>{state.reduceGlass=!tweaks.glass;render();}});
    tweak.addToggle(tweaks,'glass',{label:'Glass navigation'});
  }
  window.matchMedia('(max-width:1000px)').addEventListener('change',syncSidebarControl);
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',applyAppearance);
  new MutationObserver(applyAppearance).observe(document.documentElement,{attributes:true,attributeFilter:['style','class','data-theme']});
  render();
  console.log('DictaFlow prototype ready: 3 primary destinations, Settings categories, 3 dictation modules, 12 local models.');
})();
</script>
</body>
